[project]
name = "memchat"
version = "0.1.0"
description = "Minimal ChatGPT-like chat app (FastAPI + RDS + Bedrock + Cognito)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.43.90",
    "pyjwt[crypto]>=2.9",
    "pydantic[email]>=2.7",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.uv]
package = false
